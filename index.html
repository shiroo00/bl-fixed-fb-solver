<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="BL-fixed First Block solver and trainer">

  <title>BL-fixed FB Solver</title>
</head>

<body>

  <main id="app">

    <header class="page-header">
      <h1>BL-fixed FB Solver</h1>
    </header>


    <div class="main-layout">

      <section class="cube-section">

        <div id="cubeViewer" class="cube-viewer"></div>

        <button id="resetCameraButton" type="button">
          Reset view
        </button>

      </section>


      <section class="control-section">

        <div class="panel">

          <h2>Random case</h2>

          <div class="control-row">

            <label for="distSelect">
              Optimal length
            </label>

            <select id="distSelect">
              <option value="">
                Loading...
              </option>
            </select>

            <button id="randomButton" type="button" disabled>
              Random
            </button>

          </div>

        </div>


        <div class="panel">

          <h2>Input scramble</h2>

          <div class="scramble-input-row">

            <div id="prefixControl" class="prefix-control">

              <button id="prefixButton" type="button" aria-haspopup="true" aria-expanded="false">
                Prefix
              </button>

              <div id="prefixMenu" class="prefix-menu" hidden>

                <button type="button" class="prefix-option prefix-none" data-prefix="none">
                  No prefix
                </button>


                <button type="button" class="prefix-option" data-prefix="yo" aria-label="yellow orange">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-o"></span>
                    <span class="fb-prefix-bottom face-y"></span>
                  </span>
                </button>

                <button type="button" class="prefix-option" data-prefix="wo" aria-label="white orange">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-o"></span>
                    <span class="fb-prefix-bottom face-w"></span>
                  </span>
                </button>


                <button type="button" class="prefix-option" data-prefix="yr" aria-label="yellow red">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-r"></span>
                    <span class="fb-prefix-bottom face-y"></span>
                  </span>
                </button>

                <button type="button" class="prefix-option" data-prefix="wr" aria-label="white red">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-r"></span>
                    <span class="fb-prefix-bottom face-w"></span>
                  </span>
                </button>


                <button type="button" class="prefix-option" data-prefix="yb" aria-label="yellow blue">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-b"></span>
                    <span class="fb-prefix-bottom face-y"></span>
                  </span>
                </button>

                <button type="button" class="prefix-option" data-prefix="wb" aria-label="white blue">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-b"></span>
                    <span class="fb-prefix-bottom face-w"></span>
                  </span>
                </button>


                <button type="button" class="prefix-option" data-prefix="yg" aria-label="yellow green">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-g"></span>
                    <span class="fb-prefix-bottom face-y"></span>
                  </span>
                </button>

                <button type="button" class="prefix-option" data-prefix="wg" aria-label="white green">
                  <span class="fb-prefix-icon">
                    <span class="fb-prefix-top face-g"></span>
                    <span class="fb-prefix-bottom face-w"></span>
                  </span>
                </button>

              </div>

            </div>


            <input id="scrambleInput" type="text" autocomplete="off" spellcheck="false">


            <button id="invertButton" type="button">
              Invert
            </button>

            <button id="clearButton" type="button">
              Clear
            </button>

            <button id="readButton" type="button" disabled>
              Read
            </button>

          </div>

        </div>


        <div class="panel">

          <h2>Current case</h2>

          <div class="case-info">

            <div class="info-row">

              <span class="info-label">
                Optimal length
              </span>

              <span id="currentOptimalLength">
                —
              </span>

            </div>


            <div class="info-row">

              <span class="info-label">
                Optimal solutions
              </span>

              <span id="currentOptimalCount">
                —
              </span>

            </div>

          </div>


          <div class="scramble-display">

            <div class="info-label">
              Scramble
            </div>

            <div id="scrambleDisplay">
              —
            </div>

          </div>

          <div id="shortScrambleArea" class="scramble-display" hidden>

            <div class="info-label">
              Short scramble
            </div>

            <div id="shortScrambleDisplay">
              —
            </div>

          </div>


          <button id="solveButton" type="button" disabled>
            Show solutions
          </button>

        </div>


        <div id="solutionPanel" class="panel" hidden>

          <h2>Solutions</h2>


          <div id="optimalSection">

            <div class="solution-heading">

              <span id="optimalHeading">
                Optimal
              </span>

              <span id="optimalCount"></span>

            </div>

            <div id="optimalSolutions" class="solution-list"></div>

          </div>


          <button id="plusOneButton" type="button" hidden>
            +
          </button>


          <div id="plusOneSection" hidden>

            <div class="solution-heading">

              <span id="plusOneHeading">
                +1
              </span>

              <span id="plusOneCount"></span>

            </div>

            <div id="plusOneSolutions" class="solution-list"></div>

          </div>

        </div>


        <div id="statusMessage" class="status-message" aria-live="polite"></div>

      </section>

    </div>

  </main>


  <script type="module" src="/src/main.js"></script>

</body>

</html>
